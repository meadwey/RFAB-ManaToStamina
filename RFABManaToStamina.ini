[General]
; Editor ID of the lesser power this plugin creates and adds to the player.
; Cast it to flip the redirect on/off. Default: RFABManaToStamina_Toggle
ToggleAbilityEditorID=RFABManaToStamina_Toggle

; Start with the redirect enabled when a save does not carry its own state?
; false means it starts disabled and is turned on by casting the power.
EnabledByDefault=false

; Show a HUD message each time the redirect is toggled.
ShowHUDMessages=true

[Advanced]
; Float global RFAB keeps the total per-second mana upkeep in.
; Only change this if RFAB renames it.
ManaDrainUpkeepGlobal=RFAB_Global_ManaDrain_Upkeep

; A magic effect that is placed on the toggle power with magnitude 0 so the
; power is a valid, castable spell. Any harmless effect that always exists in
; RFAB.esp works.
PlaceholderEffect=RFAB_Effect_ManaDrain
