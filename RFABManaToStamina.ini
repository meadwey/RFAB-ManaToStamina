[General]
; Toggle ability editor ID (will be created). Default: RFABManaToStamina_Toggle
ToggleAbilityEditorID=RFABManaToStamina_Toggle

; Enable redirect by default on game load? false means starts disabled
EnabledByDefault=false

; Show HUD messages on toggle
ShowHUDMessages=true

; When stamina is insufficient, drain from magicka instead (matches RFAB behavior). true = fallback to magicka
FallbackToMagicka=true
