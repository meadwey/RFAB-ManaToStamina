name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Skyrim SE 1.5.97
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          cmake --version
          vcpkg version

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            build-se
            C:\vcpkg\installed
          key: deps-build-se-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json') }}
          restore-keys: |
            deps-build-se-

      - name: Configure
        run: cmake --preset vs2022-se

      - name: Build
        run: cmake --build build-se --preset release-se

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RFABManaToStamina-SE-1.5.97
          path: |
            build-se/Release/RFABManaToStamina.dll
            RFABManaToStamina.ini
